name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Build Windows installer and portable executable
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Build universal Mac disk image
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'classic-lyrics-smoke.json'
          $screenshots = Join-Path $env:RUNNER_TEMP 'classic-lyrics-screenshots'
          $exe = Join-Path $PWD 'dist/win-unpacked/Classic Lyrics.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', "--report=$report", "--screenshots=$screenshots") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          if (-not $result.passed) { throw 'No successful smoke-test result' }
          Get-Content -LiteralPath $report
      - name: Test packaged Mac app and verify universal architecture
        if: runner.os == 'macOS'
        run: |
          EXE='dist/mac-universal/Classic Lyrics.app/Contents/MacOS/Classic Lyrics'
          lipo -archs "$EXE"
          "$EXE" --self-test --report="$RUNNER_TEMP/classic-lyrics-smoke.json"
          node -e 'if (!require(process.env.RUNNER_TEMP+"/classic-lyrics-smoke.json").passed) process.exit(1)'
          cat "$RUNNER_TEMP/classic-lyrics-smoke.json"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: app-screenshots
          path: ${{ runner.temp }}/classic-lyrics-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish direct downloads and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Classic Lyrics $GITHUB_REF_NAME" --notes-file ../.github/release-notes.md *.exe *.dmg SHA256SUMS.txt
